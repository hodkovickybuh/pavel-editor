<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="A still life: a stoneware vessel, a standing folio and a small dish">
  <defs>
    <linearGradient id="bg2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef8"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#dbe2ef"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17418f"/>
      <stop offset="1" stop-color="#00204f"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#e2e8f4"/>
    </linearGradient>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg2)"/>
  <circle cx="700" cy="120" r="150" fill="#2f5fd0" opacity="0.08"/>

  <rect x="0" y="452" width="900" height="148" fill="url(#tableTop)"/>
  <line x1="0" y1="452" x2="900" y2="452" stroke="#00225a" stroke-opacity="0.22" stroke-width="2"/>

  <ellipse cx="330" cy="456" rx="150" ry="14" fill="#00225a" opacity="0.16" filter="url(#soft2)"/>
  <ellipse cx="620" cy="458" rx="120" ry="12" fill="#00225a" opacity="0.13" filter="url(#soft2)"/>

  <!-- the vessel: unglazed, one navy band -->
  <path d="M258 452 C258 330 244 300 262 240 C276 196 336 186 366 214 C398 244 392 320 392 452 Z" fill="url(#clay)"/>
  <path d="M258 452 C258 330 244 300 262 240 C276 196 336 186 366 214 C398 244 392 320 392 452 Z" fill="none" stroke="#00225a" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M262 372 L390 372" stroke="#00225a" stroke-opacity="0.75" stroke-width="14"/>
  <ellipse cx="316" cy="206" rx="42" ry="11" fill="#ffffff"/>
  <ellipse cx="316" cy="206" rx="42" ry="11" fill="none" stroke="#00225a" stroke-opacity="0.28" stroke-width="2"/>

  <!-- the folio, standing, navy edge -->
  <path d="M470 452 L470 250 L604 214 L604 452 Z" fill="#ffffff"/>
  <path d="M470 452 L470 250 L604 214 L604 452 Z" fill="none" stroke="#00225a" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M604 214 L640 226 L640 452 L604 452 Z" fill="url(#deep)"/>
  <g stroke="#00225a" stroke-opacity="0.2" stroke-width="2">
    <line x1="496" y1="300" x2="578" y2="284"/>
    <line x1="496" y1="330" x2="556" y2="317"/>
    <line x1="496" y1="360" x2="570" y2="345"/>
  </g>

  <!-- the small dish -->
  <path d="M680 452 A62 30 0 0 0 804 452 Z" fill="#ffffff"/>
  <path d="M680 452 A62 30 0 0 0 804 452 Z" fill="none" stroke="#00225a" stroke-opacity="0.22" stroke-width="2"/>
  <ellipse cx="742" cy="452" rx="62" ry="10" fill="#eef2f9"/>
  <ellipse cx="742" cy="452" rx="62" ry="10" fill="none" stroke="#00225a" stroke-opacity="0.18" stroke-width="2"/>

  <!-- one measured span, the tool's signature -->
  <g stroke="#2f5fd0" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="120" y1="206" x2="120" y2="452"/>
    <line x1="110" y1="206" x2="130" y2="206"/>
    <line x1="110" y1="452" x2="130" y2="452"/>
  </g>
  <text x="120" y="336" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1c4699" text-anchor="middle" opacity="0.8" transform="rotate(-90 120 336)">246</text>
</svg>
